<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div><strong>Nova</strong><span>AI Assistant</span></div>
      </div>

      <button id="newChat" class="new-chat">＋ New chat</button>

      <div class="section-label">Chats</div>
      <div id="chatList" class="chat-list"></div>

      <div class="sidebar-bottom">
        <button id="clearChat" class="side-button">⌫ Clear conversation</button>
        <div class="status"><span></span> Local app</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-button">☰</button>
        <div>
          <h1>Nova AI</h1>
          <p>Ask anything. Build anything.</p>
        </div>
        <button id="theme" class="icon-button" title="Toggle theme">☼</button>
      </header>

      <section id="messages" class="messages">
        <div class="welcome">
          <div class="welcome-icon">✦</div>
          <h2>What can I help you build?</h2>
          <p>Your private local web app powered by an AI API.</p>
          <div class="suggestions">
            <button data-prompt="Help me build a gaming website">Gaming website</button>
            <button data-prompt="Explain a difficult topic simply">Explain something</button>
            <button data-prompt="Write JavaScript for a useful tool">Write code</button>
            <button data-prompt="Give me 10 creative project ideas">Project ideas</button>
          </div>
        </div>
      </section>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Message Nova..." autocomplete="off"></textarea>
        <button id="send" class="send" type="submit">➤</button>
      </form>
      <div class="disclaimer">Nova can make mistakes. Check important information.</div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
